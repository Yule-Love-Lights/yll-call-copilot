# Railway / Nixpacks build config for the live-coaching BRIDGE only
# (scripts/live-bridge.mjs, a standalone WebSocket server). This repo's Railway
# service hosts just the bridge; the Next.js app deploys separately on Vercel,
# which ignores this file. Override the default Node build phase to a no-op so
# Railway does NOT run `next build` (the bridge needs only `npm ci`'d deps,
# not a compiled Next app). The start command lives in railway.json.
[phases.build]
cmds = []
