name: Hub CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, build, and local contract pin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Hub repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify checked-in contract pin
        run: npm run verify:ops-contract

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  database-security:
    name: Supabase RLS and role impersonation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Hub repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.112.0

      - name: Apply migrations to a fresh local Supabase database
        run: supabase db start

      - name: Run pgTAP default-deny and impersonation tests
        run: supabase test db --local

      - name: Stop and remove the local database
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
